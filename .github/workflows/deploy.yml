name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - v4
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Install Staticrypt
        run: npm install -g staticrypt
      - name: Build Quartz
        run: npx quartz build
      - name: Encrypt index.html with Staticrypt
        run: staticrypt public/index.html -p "${{ secrets.BODA_PASSWORD }}" --short -d public --title "Carlo & Jesús" --instructions "¡Bienvenidos! Por favor, introduce la contraseña para ver los detalles de nuestra boda." --template-color-primary "#8b9a47" --template-button "Acceder"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
